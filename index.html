<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | JustScale</title>
    <meta name="description" content="We run paid ads for high-ticket businesses scaling past their ceiling on cold traffic. Watch the video and fill out the application.">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css?v=20260407k">
    <style>
        #nav .container { justify-content: center; }
        /* Shared footer is a space-between row; stack it centred on this page. */
        footer .container { flex-direction: column; justify-content: center; gap: 14px; }
        .book-hero { text-align: center; padding: 96px 28px 28px; }
        .book-hero h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 18px; line-height: 1.18; max-width: 600px; margin-left: auto; margin-right: auto; }
        .book-hero p { color: var(--text-s); font-size: 1.08rem; line-height: 1.6; max-width: 500px; margin: 0 auto; }
        .book-hero .gold-rule { width: 60px; height: 2px; background: var(--gold); margin: 26px auto 0; opacity: 0.5; }
        .book-vsl { max-width: 860px; margin: 0 auto; padding: 0 28px 28px; }
        .book-vsl-frame { position: relative; width: 100%; border: 2px solid var(--border); border-radius: var(--r); overflow: hidden; }
        .book-app { max-width: 900px; margin: 0 auto; padding: 0 20px 28px; }
        .sr { transition: opacity 0.6s ease, transform 0.6s ease; }
        .sr.visible { opacity: 1 !important; transform: translateY(0) !important; }
        @media (max-width: 768px) {
            .book-hero { padding: 88px 24px 20px; }
            .book-hero h1 { font-size: 1.7rem; }
            .book-hero p { font-size: 1rem; }
            .book-vsl { padding: 0 18px 20px; }
        }
    </style>
</head>
<body>
<div class="scroll-progress"></div>
<div class="page" id="page">

    <!-- NAV -->
    <nav id="nav">
        <div class="container">
            <a href="./" class="logo">
                <img src="logo.png" alt="JustScale" class="logo-img">
            </a>
        </div>
    </nav>

    <!-- HEADLINE -->
    <div class="book-hero">
        <div class="container">
            <h1 class="sr">How we help businesses scale with paid advertising.</h1>
            <p class="sr">We run the ads, position your offer for cold traffic, and build the system around it.</p>
            <div class="gold-rule sr"></div>
        </div>
    </div>

    <!-- VSL -->
    <div class="book-vsl">
        <div class="book-vsl-frame">
            <script src="https://fast.wistia.com/player.js" async></script>
            <script src="https://fast.wistia.com/embed/1lsrejk2ks.js" async type="module"></script>
            <style>wistia-player[media-id='1lsrejk2ks']:not(:defined) { background: center / contain no-repeat url('https://fast.wistia.com/embed/medias/1lsrejk2ks/swatch'); display: block; filter: blur(5px); padding-top:56.25%; }</style>
            <wistia-player media-id="1lsrejk2ks" aspect="1.7777777777777777"></wistia-player>
        </div>
    </div>

    <!-- APPLICATION -->
    <div class="book-app">
        <div data-tf-live="01KM6NNMYV0EA2VFNS6N8B7555" style="width:100%;height:500px;"></div>
        <script src="//embed.typeform.com/next/embed.js"></script>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <a href="./" class="logo">
                <img src="logo-white.png" alt="JustScale" class="logo-img">
            </a>
            <span class="foot-copy">&copy; 2026 JustScale. All rights reserved.</span>
        </div>
    </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="shared.js?v=20260407b"></script>
</body>
</html>
